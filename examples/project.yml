root: ~/Code/acme

before_start:
  - mise install

before_stop:
  - echo "stopping $AMBER_PROJECT"

sessions:
  - label: acme-api
    root: ./api
    after_start:
      - rex window rename -s "$REX_SESSION" 1 server
    tabs:
      - label: server
        root: ./cmd/server
        split: right
        ratio: 0.6
        panes:
          - label: app
            commands:
              - go run .
          - root: ../../
            split: down
            panes:
              - label: tests
                commands:
                  - go test ./... -count=1
              - label: logs
                commands:
                  - tail -f var/app.log
      - label: editor
        commands:
          - nvim .

  - label: acme-web
    root: ./web
    tabs:
      - label: dev
        commands:
          - npm run dev
      - label: editor
        commands:
          - nvim .
